[project]
name = "ticket-assignment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "greenlet>=3.5.5",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "openai>=1.0.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.62.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worksmith"]
